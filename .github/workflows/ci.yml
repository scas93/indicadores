name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: indicadores, POSTGRES_PASSWORD: indicadores, POSTGRES_DB: indicadores_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U indicadores" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: pytest (SQLite)
        run: pytest -q
      - name: pytest (Postgres) + migraciones
        env:
          TEST_DATABASE_URL: postgresql+psycopg://indicadores:indicadores@localhost:5432/indicadores_test
          DATABASE_URL: postgresql+psycopg://indicadores:indicadores@localhost:5432/indicadores_test
          PASSWORD_ENCRYPTION_KEY: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
        run: |
          pytest -q
          alembic upgrade head
